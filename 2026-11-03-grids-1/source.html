    <!--
      The G of our own word, its modules stretched to the square, black on the
      page's ground. Drawn from the typeface itself in tools/favicon.js rather
      than by hand, so it cannot drift from the letter the site is built out of.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link
      rel="preload"
      href="/fonts/ObysSans-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      Read before the first paint, which is the whole point of it being here
      rather than in style.css: the stylesheet is imported from main.js and so
      arrives WITH the script, and until it does the browser paints this file
      exactly as written — unstyled type on the left of a white page. That is
      the blink on every reload.

      Nothing is shown until the machinery is up and has placed it. Everything
      else about how any of it looks stays in style.css.
    -->
    <style>
      html { background: #fff; }
      body { margin: 0; }
      .intro,
      .preloader { visibility: hidden; }
      .is-up .intro,
      .is-up .preloader { visibility: visible; }
    </style>

    <!--
      Before anything else runs. A browser puts the reader back where they were
      when the page is reloaded, and it does that around the first paint —
      earlier than any module of ours can execute. Reloading from halfway down
      the page therefore showed the old place for a frame, which is a flash of
      the contents and its type. Turned off here, it never happens at all.
    -->
    <script>
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      window.scrollTo(0, 0);
    </script>

    <!-- Google tag (gtag.js) — the Grids 03 stream. Loaded async so it never
         stands between the reader and the first paint. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-C7819HM3SM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-C7819HM3SM');
    </script>
    <script type="module" crossorigin src="/assets/index-DG09JV5w.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DESn0ymm.css">
